<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - A&C Japan Auto Parts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { dark: '#1a2a3a', red: '#c41e24', gold: '#f5a623' },
                        admin: { dark: '#0f172a', side: '#1e293b', accent: '#3b82f6' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-admin-side text-gray-300 flex flex-col h-full shrink-0 shadow-xl z-20">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 bg-admin-dark border-b border-gray-800">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="text-xl font-black italic tracking-tighter text-white">
                    A&C <span class="text-primary-red">JAPAN</span>
                </div>
                <span class="text-xs font-bold text-admin-accent uppercase tracking-widest ml-1">Admin</span>
            </a>
        </div>

        <!-- Navigation -->
        <div class="flex-grow overflow-y-auto py-4">
            <p class="px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Main Menu</p>
            <nav class="space-y-1 mb-6">
                <a href="#" data-admin-nav="dashboard" class="flex items-center px-6 py-3 bg-admin-accent/20 text-white border-l-4 border-admin-accent"><i class="fas fa-tachometer-alt w-6"></i> Dashboard</a>
                <a href="#" data-admin-nav="users" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-users w-6"></i> Users Management</a>
                <a href="#" data-admin-nav="products" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-box w-6"></i> Products & Vehicles</a>
                <a href="#" data-admin-nav="auctions" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-gavel w-6"></i> Auctions Monitor</a>
            </nav>

            <p class="px-6 text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Configuration</p>
            <nav class="space-y-1">
                <a href="#" data-admin-nav="categories" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-tags w-6"></i> Categories</a>
                <a href="#" data-admin-nav="orders" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-shopping-cart w-6"></i> Orders Management</a>
                <a href="#" data-admin-nav="reports" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-chart-line w-6"></i> Financial Reports</a>
                <a href="#" data-admin-nav="settings" class="flex items-center px-6 py-3 hover:bg-gray-800 hover:text-white transition"><i class="fas fa-cog w-6"></i> Site Settings</a>
            </nav>
        </div>

        <!-- User Profile -->
        <div class="p-4 bg-admin-dark border-t border-gray-800">
            <div class="flex items-center">
                <img src="https://ui-avatars.com/api/?name=Admin+User&background=3b82f6&color=fff" class="w-10 h-10 rounded-full mr-3">
                <div>
                    <p class="text-sm font-bold text-white">Super Admin</p>
                    <a href="login.html" class="text-xs text-gray-400 hover:text-white"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- Top Header -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10 shrink-0">
            <div class="flex items-center">
                <button class="text-gray-500 hover:text-gray-800 md:hidden"><i class="fas fa-bars text-xl"></i></button>
                <div class="hidden md:flex ml-4 relative">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search anything..." class="pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-admin-accent w-64 bg-gray-50">
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button class="relative text-gray-500 hover:text-admin-accent transition">
                    <i class="far fa-bell text-lg"></i>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white w-4 h-4 rounded-full text-[10px] font-bold flex items-center justify-center">12</span>
                </button>
                <button class="relative text-gray-500 hover:text-admin-accent transition">
                    <i class="far fa-envelope text-lg"></i>
                    <span class="absolute -top-1 -right-1 bg-blue-500 text-white w-4 h-4 rounded-full text-[10px] font-bold flex items-center justify-center">4</span>
                </button>
            </div>
        </header>

        <!-- Main Dashboard View -->
        <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
            <div id="admin-content" class="w-full">
                <!-- Content injected by AdminController -->
            </div>
        </main>
    </div>

    <script type="module" src="assets/js/app.js"></script>
    <script>
        // Example for mock interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if(this.classList.contains('bg-green-100')) {
                    alert('Listing Approved successfully! API: ' + API_CONFIG.BASE_URL + API_CONFIG.ENDPOINTS.PRODUCTS.UPDATE.replace('{id}', 'X'));
                    this.closest('li').remove();
                } else if(this.classList.contains('bg-red-100')) {
                    alert('Listing Rejected. API: ' + API_CONFIG.BASE_URL + API_CONFIG.ENDPOINTS.PRODUCTS.DELETE.replace('{id}', 'X'));
                    this.closest('li').remove();
                }
            });
        });
    </script>
</body>
</html>
